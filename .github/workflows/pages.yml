name: pages

# Deploy strongwind.dev to GitHub Pages from Actions. The site is static, so
# the build job only stages the published files into _site/ and leaves the
# repo tooling (scripts, npm manifests, lint configs) out of the artifact.
"on":
  push:
    branches: [main]
  # refresh-repos-cache.yml commits with the workflow token, and pushes made
  # with that token never start workflows, so it dispatches this one instead.
  workflow_dispatch:

# Deny by default at the top level; each job gets only what it needs.
permissions: {}

# One deploy at a time, and never cancel one mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Stage site
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Stage published files
        run: |
          set -euo pipefail
          # CNAME and .nojekyll only matter to branch-based Pages builds; under
          # Actions the custom domain lives in the repo's Pages settings.
          rsync -a \
            --exclude=.git/ \
            --exclude=.github/ \
            --exclude=node_modules/ \
            --exclude=scripts/ \
            --exclude=_site/ \
            --exclude=package.json \
            --exclude=package-lock.json \
            --exclude=.gitignore \
            --exclude=.prettierignore \
            --exclude=.prettierrc.json \
            --exclude=.yamllint.yml \
            --exclude=.nojekyll \
            --exclude=CNAME \
            ./ _site/
          find _site -type f | sort

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site/

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write # publish the uploaded artifact
      id-token: write # OIDC token deploy-pages uses to prove the run's origin
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
